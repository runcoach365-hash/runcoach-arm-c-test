name: RN shell (AZ.69 S1)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rn-shell/**'
      - '.github/workflows/rn-shell.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create project files on the first run only
        id: boot
        working-directory: rn-shell
        run: |
          if [ ! -f package.json ]; then
            npx --yes create-expo-app@latest ../tmp-app --template blank --no-install --yes
            cp -an ../tmp-app/. .
            rm -rf ../tmp-app App.tsx App.ts App.jsx assets
            echo "bootstrapped=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        working-directory: rn-shell
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node -e "const p=require('./package.json');console.log('versions',JSON.stringify(p.dependencies))"

      - name: Generate the Android project
        working-directory: rn-shell
        run: npx expo prebuild --platform android --no-install

      - name: Build the installable file (release variant, throwaway debug signature, no dev server needed)
        working-directory: rn-shell/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Keep the generated package files (first run only)
        if: steps.boot.outputs.bootstrapped == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rn-shell
          git commit -m "S1: package files generated on the first cloud run"
          git push origin HEAD:main

      - name: Publish the file as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp rn-shell/android/app/build/outputs/apk/release/app-release.apk "rn-shell-s1-build${{ github.run_number }}.apk"
          gh release create "rn-shell-${{ github.run_number }}" \
            "rn-shell-s1-build${{ github.run_number }}.apk" \
            --prerelease \
            --title "S1 shell build ${{ github.run_number }}" \
            --notes "Throwaway React Native shell (AZ.69 S1). No plan engine, no data, no network use."
